      <text x="16" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#6EE7B7">✓ Routed with Zero Data Retention (ZDR) &amp; Cost Ledger</text>
      <text x="16" y="208" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#A7F3D0">84/84 Contract &amp; Security Tests Passing  •  SKILL.md Bundled</text>
