    <text x="106" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle" letter-spacing="1.1">FALSABLE // @falsable/entropos</text>

