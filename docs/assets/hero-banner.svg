      <text x="16" y="73" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#A78BFA">2. ENTROPY PROBE │ Sub-ms Structural Complexity Score</text>
      <text x="16" y="89" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#94A3B8">Shannon Entropy + Lexical Diversity + Syntactic Branching</text>

